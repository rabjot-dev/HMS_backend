name: Rollback Backend

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Git SHA to roll back to (leave empty to use last known-good deploy)"
        required: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event.inputs.sha }}

    steps:
      - name: Rollback via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_RABJOT }}
          username: ${{ secrets.EC2_RABJOT_USER }}
          key: ${{ secrets.EC2_RABJOT_SSH }}
          envs: TARGET_SHA
          script: |
            set -e

            cd ~/hms_project/HMS_backend

            LAST_GOOD_FILE=~/hms_project/.backend_last_good_sha

            if [ -n "$TARGET_SHA" ]; then
              ROLLBACK_TARGET="$TARGET_SHA"
            elif [ -f "$LAST_GOOD_FILE" ]; then
              ROLLBACK_TARGET=$(cat "$LAST_GOOD_FILE")
            else
              echo "No target SHA provided and no last-known-good file found. Aborting."
              exit 1
            fi

            echo "Rolling back backend to $ROLLBACK_TARGET..."

            git fetch origin
            git reset --hard "$ROLLBACK_TARGET"
            npm ci
            pm2 restart hms-backend --update-env
            pm2 save

            echo "Waiting for backend to start..."
            sleep 10

            echo "Running health check..."
            curl --fail --silent --show-error https://bootstraphms.duckdns.org/health

            echo "$ROLLBACK_TARGET" > "$LAST_GOOD_FILE"
            echo "Rollback to $ROLLBACK_TARGET completed successfully."
