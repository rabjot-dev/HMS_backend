name: Deploy Backend

on:
  push:
    branches:
      - feature/R_SP6   # change to your deployment branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_RABJOT }}
          username: ${{ secrets.EC2_RABJOT_USER }}
          key: ${{ secrets.EC2_RABJOT_KEY }}
          script: |
            cd ~/hms_project/HMS_backend
              git fetch origin
            git reset --hard origin/feature/R_SP6

            npm install

            pm2 restart hms-backend --update-env

            pm2 save