name: Deploy Backend

on:
  push:
    branches:
      - feature/R_SP6

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_RABJOT }}
          username: ${{ secrets.EC2_RABJOT_USER }}
          key: ${{ secrets.EC2_RABJOT_SSH }}
          script: |
            set -e

            cd ~/hms_project/HMS_backend

            LAST_GOOD_FILE=~/hms_project/.backend_last_good_sha
            PREV_SHA=$(git rev-parse HEAD)
            echo "Currently running SHA: $PREV_SHA"

            deploy_sha () {
              TARGET_SHA=$1
              echo "Deploying $TARGET_SHA..."
              git fetch origin
              git reset --hard "$TARGET_SHA"
              npm ci
              pm2 restart hms-backend --update-env
              pm2 save
              echo "Waiting for backend to start..."
              sleep 10
            }

            health_check () {
              curl --fail --silent --show-error https://bootstraphms.duckdns.org/health
            }

            echo "Starting Backend Deployment..."
            git fetch origin
            NEW_SHA=$(git rev-parse origin/feature/R_SP6)
            deploy_sha "$NEW_SHA"

            echo "Running health check..."
            if health_check; then
              echo "$NEW_SHA" > "$LAST_GOOD_FILE"
              echo "Backend deployment completed successfully. Marked $NEW_SHA as last known good."
            else
              echo "Health check FAILED for $NEW_SHA. Rolling back to $PREV_SHA..."
              deploy_sha "$PREV_SHA"

              if health_check; then
                echo "$PREV_SHA" > "$LAST_GOOD_FILE"
                echo "Rollback to $PREV_SHA succeeded. Failing this job so the bad deploy gets attention."
              else
                echo "Rollback ALSO failed health check. Manual intervention required immediately."
              fi

              exit 1
            fi
