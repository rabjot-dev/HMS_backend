name: Deploy Backend

on:
  push:
    branches:
      - feature/R_SP6  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_RABJOT }}
          username: ${{ secrets.EC2_RABJOT_USER }}
          key: ${{ secrets.EC2_RABJOT_SSH }}
          script: |
            echo "Starting Backend Deployment..."
            cd ~/hms_project/HMS_backend
            git fetch origin
            git reset --hard origin/feature/R_SP6
            echo "Installing dependencies..."
            npm ci
            echo "Restarting PM2..."
            pm2 restart hms-backend --update-env
            pm2 save
            echo "Waiting for backend to start..."
            sleep 10
            echo "Running health check..."
            curl --fail https://bootstraphms.duckdns.org/health
            echo "Backend deployment completed successfully."cre