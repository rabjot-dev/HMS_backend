<div class="container">

  <div class="card">
    <app-page-header
  title="Reset Password">
</app-page-header>


    <form (ngSubmit)="resetPassword()">

      <input
        type="email"
        placeholder="Email"
        [(ngModel)]="email"
        name="email"
        readonly
      >

      <input
        type="password"
        placeholder="Temporary Password"
        [(ngModel)]="oldPassword"
        name="oldPassword"
      >

      <input
        type="password"
        placeholder="New Password"
        [(ngModel)]="newPassword"
        name="newPassword"
      >

      <button type="submit">Reset Password</button>

    </form>

  </div>

</div>
