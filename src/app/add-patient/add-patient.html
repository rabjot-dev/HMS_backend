<div class="form-container">
  <div class="form-header">
    <button class="back-btn" (click)="goBack()">← Back</button>
    <h1>Add New Patient</h1>
  </div>

  <div class="form-card">
    <form (ngSubmit)="addPatient()">

      <h3 class="section-title">Patient Information</h3>
      <div class="form-row">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" placeholder="Enter patient name" [(ngModel)]="name" name="name" required />
        </div>
        <div class="form-group">
          <label>Phone *</label>
          <input type="text" placeholder="Enter phone number" [(ngModel)]="phone" name="phone" required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="Enter email" [(ngModel)]="email" name="email" />
        </div>
        <div class="form-group">
          <label>Gender</label>
          <select [(ngModel)]="gender" name="gender">
            <option value="">Select Gender</option>
            <option value="MALE">Male</option>
            <option value="FEMALE">Female</option>
            <option value="OTHER">Other</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" [(ngModel)]="dob" name="dob" />
        </div>
        <div class="form-group">
          <label>Address</label>
          <input type="text" placeholder="Enter address" [(ngModel)]="address" name="address" />
        </div>
      </div>

      <h3 class="section-title">Emergency Contact</h3>
      <div class="form-row">
        <div class="form-group">
          <label>Contact Name</label>
          <input type="text" placeholder="Emergency contact name" [(ngModel)]="emergencyName" name="emergencyName" />
        </div>
        <div class="form-group">
          <label>Relationship</label>
          <input type="text" placeholder="e.g. Spouse, Parent" [(ngModel)]="emergencyRelationship" name="emergencyRelationship" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Emergency Phone</label>
          <input type="text" placeholder="Emergency contact phone" [(ngModel)]="emergencyPhone" name="emergencyPhone" />
        </div>
      </div>

      <button type="submit" class="submit-btn">Add Patient</button>
    </form>
  </div>
</div>
