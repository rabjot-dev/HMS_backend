<div class="receptionist-layout">

  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="logo-icon">🏥</span>
      <span class="logo-text">HMS</span>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item" (click)="goToAddPatient()">
        <span class="nav-icon">👤</span>
        <span>Register Patient</span>
      </button>
      <button class="nav-item" (click)="goToBookAppointment()">
        <span class="nav-icon">📅</span>
        <span>Book Appointment</span>
      </button>
      <button class="nav-item" (click)="goToViewAppointments()">
        <span class="nav-icon">📋</span>
        <span>View Appointments</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" (click)="logout()">
        <span class="nav-icon">🚪</span>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <div class="welcome-header">
      <h1>Welcome, Receptionist 👋</h1>
      <p>Select an option from the sidebar to get started.</p>
    </div>

    <div class="cards-grid">
      <div class="card" (click)="goToAddPatient()">
        <div class="card-icon">👤</div>
        <div class="card-info">
          <h3>Register Patient</h3>
          <p>Add a new patient to the system</p>
        </div>
        <span class="card-arrow">→</span>
      </div>

      <div class="card" (click)="goToBookAppointment()">
        <div class="card-icon">📅</div>
        <div class="card-info">
          <h3>Book Appointment</h3>
          <p>Schedule a patient appointment with a doctor</p>
        </div>
        <span class="card-arrow">→</span>
      </div>

      <div class="card" (click)="goToViewAppointments()">
        <div class="card-icon">📋</div>
        <div class="card-info">
          <h3>View Appointments</h3>
          <p>View and manage all appointments</p>
        </div>
        <span class="card-arrow">→</span>
      </div>
    </div>
  </main>

</div>
